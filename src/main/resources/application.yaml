ktor:
  application:
    modules:
      - ru.planner.ApplicationKt.module
  deployment:
    port: 8080

jwt:
  domain: ${JWT_DOMAIN:"https://planner.example.com"}
  audience: ${JWT_AUDIENCE:"planner-trainer"}
  realm: ${JWT_REALM:"Planner API"}
  secret: ${JWT_SECRET:"change-me-in-production-must-be-at-least-32-chars"}

postgres:
  url: ${DB_URL:"jdbc:postgresql://localhost:5439/planner"}
  user: ${DB_USER:"planner"}
  password: ${DB_PASSWORD:"planner"}